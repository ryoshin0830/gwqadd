name: publish

# Whatever version sits in package.json on main is what npm should be serving.
# Every push to main runs the suite, then publishes — but only when that exact
# version is not on the registry yet, so ordinary commits are a test run and a
# no-op rather than a failed release.
#
# Publishing uses npm trusted publishing (OIDC): CI mints a short-lived token
# per run, so no npm credential exists on a laptop or in this repository's
# secrets. That matters here — CLAUDE.md refuses install scripts because of the
# Shai-Hulud worm, and a long-lived publish token on disk is the other half of
# that same attack. It is also what made every release need a browser and a
# passkey.
#
# One-time setup per package, on npmjs.com → the package → Settings → Trusted
# Publisher: GitHub Actions, owner `ryoshin0830`, this repository, workflow
# filename `publish.yml`, allowed action `npm publish`.
#
# The release tag `npm version` writes is history, not the trigger. Firing on
# both the branch and the tag would start two runs for one `git push
# --follow-tags`, and they would race for the same version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm authenticates the publish with

# Never let two runs publish at once. Not cancel-in-progress: killing a run
# mid-publish is worse than making the next one wait.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm must be new enough for trusted publishing
        run: |
          have=$(npm --version)
          printf '%s\n%s\n' 11.5.1 "$have" | sort -V -C \
            || { echo "npm $have is older than the 11.5.1 trusted publishing needs"; exit 1; }
          echo "npm $have"

      # The suite skips any shell it cannot find and every interactive test when
      # `expect` is missing, so without this step the release gate quietly stops
      # checking --init and the whole naming flow.
      - name: Install the shells and the pty the suite needs
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh expect
          # fish lives in universe; it is the one the suite can afford to skip.
          sudo apt-get install -y fish || echo "fish unavailable — its --init test will skip"

      # No `npm ci`: this package has zero dependencies (I12) and deliberately
      # carries no lockfile, so there is nothing to install.
      - run: npm test

      - name: Is this version already on the registry?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "main is at $name@$version"
          # A package that has never been published 404s here; an unreachable
          # registry fails here too. Both land on "try to publish", because npm
          # itself refuses a duplicate version — a loud rejection beats silently
          # skipping a release someone is waiting for.
          published=$(npm view "$name" versions --json 2>/dev/null || echo null)
          if node -e '
            const v = process.argv[1];
            let list = [];
            try { const p = JSON.parse(process.argv[2]); list = [].concat(p == null ? [] : p); } catch (e) {}
            process.exit(list.includes(v) ? 0 : 1);
          ' "$version" "$published"; then
            echo "$version is already published — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version is new — publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs the suite again plus `npm pack --dry-run` and
      # --help. No NODE_AUTH_TOKEN — OIDC is the credential.
      - name: npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
